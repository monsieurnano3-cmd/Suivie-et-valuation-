<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Suivi pédagogique</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4e79"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#f6f5f1;--s:#fff;--t:#1f2430;--m:#6b7280;--a:#1f4e79;--b:#e3e1da;--g:#2e7d4f;--r:#b3402f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171c;--s:#1d2128;--t:#e8e8e4;--m:#9aa1ad;--a:#6fa8dc;--b:#2e343d;--g:#6fcf97;--r:#e57a67;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14171c;--s:#1d2128;--t:#e8e8e4;--m:#9aa1ad;--a:#6fa8dc;--b:#2e343d;--g:#6fcf97;--r:#e57a67;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Georgia,'Times New Roman',serif}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--s);border:1px solid var(--b);border-radius:6px;padding:6px 9px;max-width:100%}
button{cursor:pointer;background:var(--a);color:#fff;border:0}button.g{background:var(--s);color:var(--t);border:1px solid var(--b)}button.d{background:var(--r)}button.sm{padding:3px 8px;font-size:13px}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}nav{background:var(--s);border-right:1px solid var(--b);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:17px;margin:0 0 10px;color:var(--a)}nav a{padding:8px 10px;border-radius:6px;cursor:pointer}nav a.on{background:var(--a);color:#fff}
main{padding:16px;min-width:0}.top{display:flex;gap:8px;margin-bottom:14px}.top input{flex:1}
.card{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:26px;color:var(--a)}.m{color:var(--m);font-size:13px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--m);text-transform:uppercase}
td input,td select{width:100%;min-width:60px}.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}.tabs button{background:var(--s);color:var(--t);border:1px solid var(--b);white-space:nowrap}.tabs button.on{background:var(--a);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.bar{height:14px;background:var(--a);border-radius:3px}.pos{color:var(--g)}.neg{color:var(--r)}.tag{font-size:12px;padding:1px 7px;border-radius:9px;border:1px solid var(--b)}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}#mod>div{background:var(--s);border-radius:10px;padding:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
@media(max-width:800px){#app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b)}nav h1{display:none}nav a{white-space:nowrap}}
@media print{nav,.top,.no{display:none!important}#mod{position:static;background:none;display:block}#app{display:block}}
</style></head><body><div id="gate"></div><div id="app" style="display:none"><nav id="nav"></nav><main><div class="top no"><input id="q" placeholder="Recherche globale : classe, élève, devoir, séance, contrôle…" oninput="S.q=this.value;S.v=this.value?'search':'dash';draw()"><span id="sync" class="m"></span><button class="g" onclick="theme()">◐</button><button class="g" onclick="FB.out()">Quitter</button></div><div id="v"></div></main></div><div id="mod"><div id="mc"></div></div>
<script>
const K='suivi_ped_v1',CATS={participation:'Participation',devoir:'Devoirs',controle:'Contrôles',expose:'Exposés',examen:'Examens'},PR={P:'Présent',A:'Absent',R:'Retard',J:'Absence justifiée'};
let db=null;
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=i=>document.getElementById(i),val=i=>$(i)?$(i).value.trim():'';
let _t;const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}clearTimeout(_t);_t=setTimeout(()=>window.FB&&FB.push(),1200)};
const W0=()=>({participation:10,devoir:20,controle:20,expose:10,examen:40});
function demo(){let r=1;const rnd=()=>(r=r*16807%2147483647)/2147483647;const N=['Kouassi Awa','Traoré Ibrahim','Koné Mariam','Yao Kevin','Bamba Fatou','N’Guessan Paul','Diallo Salif','Konan Estelle','Ouattara Moussa','Tano Christelle'];
const d={demo:1,classes:[],students:[],sessions:[],evals:[],disc:[]};
[['3ème A','Troisième','Français'],['Tle D','Terminale','Philosophie']].forEach((c,i)=>{const id='c'+i;d.classes.push({id,name:c[0],level:c[1],subject:c[2],year:'2026-2027',desc:'Données de démonstration',w:W0(),scale:20,archived:0});
const st=N.slice(i*3,i*3+7).map(n=>({id:uid(),classId:id,nom:n.split(' ')[0],prenom:n.split(' ')[1]}));d.students.push(...st);
[['devoir','Devoir 1',20,1],['controle','Contrôle 1',20,2],['expose','Exposé',20,1],['examen','Composition',20,3]].forEach((e,j)=>{const sc={};st.forEach(s=>{if(rnd()>.12)sc[s.id]=Math.round((6+rnd()*13)*2)/2});d.evals.push({id:uid(),classId:id,type:e[0],title:e[1],date:'2026-10-'+String(5+j*6).padStart(2,'0'),max:e[2],coef:e[3],scores:sc,obs:''})});
for(let j=0;j<3;j++){const att={};st.forEach(s=>{const x=rnd();att[s.id]={p:x>.85?'A':x>.75?'R':'P',part:Math.floor(rnd()*6),obs:''}});d.sessions.push({id:uid(),classId:id,date:'2026-10-'+String(6+j*7).padStart(2,'0'),theme:'Chapitre '+(j+1),obj:'',att})}});
d.disc.push({id:uid(),studentId:d.students[1].id,date:'2026-10-12',cat:'Perturbation du cours',sev:'Moyenne',desc:'Bavardages répétés',mesure:'Avertissement oral',pos:0});return d}
const S={v:'dash',cid:null,tab:'eleves',sel:null,sid:null,eid:null,q:''};
const cl=id=>db.classes.find(c=>c.id==id),stu=c=>db.students.filter(s=>s.classId==c),evs=(c,t)=>db.evals.filter(e=>e.classId==c&&(!t||t.includes(e.type))),ses=c=>db.sessions.filter(s=>s.classId==c).sort((a,b)=>a.date<b.date?-1:1);
const f=(n,c)=>n==null?'—':(n/20*(c?c.scale||20:20)).toFixed(2).replace(/\.?0+$/,'').replace('.',',');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function cat(c,s,k){if(k=='participation'){const v=[];ses(c.id).forEach(x=>{const a=x.att[s.id];if(a&&a.p!='A'&&a.p!='J'&&a.part!=null)v.push(a.part/5*20)});return mean(v)}
let n=0,d=0;evs(c.id,[k]).forEach(e=>{const v=e.scores[s.id];if(v!=null){n+=v/e.max*20*e.coef;d+=e.coef}});return d?n/d:null}
function avg(c,s){let n=0,d=0,prov=0;for(const k in CATS){const w=+c.w[k]||0,v=cat(c,s,k);if(v==null){if(w)prov=1}else{n+=v*w;d+=w}}return{m:d?n/d:null,prov}}
function pres(c,s){let t=0,p=0;ses(c.id).forEach(x=>{const a=x.att[s.id];if(a){t++;if(a.p=='P'||a.p=='R'||a.p=='J')p++}});return t?p/t*100:null}
const ev=(c,e)=>{const v=stu(c.id).map(s=>e.scores[s.id]).filter(x=>x!=null).map(x=>x/e.max*20);return{n:v.length,m:mean(v),hi:v.length?Math.max(...v):null,lo:v.length?Math.min(...v):null,ok:v.length?v.filter(x=>x>=10).length/v.length*100:null}};
function line(pts,h=110){if(pts.length<2)return'<div class="m">Pas assez de données.</div>';const w=300,x=i=>10+i*(w-20)/(pts.length-1),y=v=>h-8-v/20*(h-16);return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:420px"><line x1="10" x2="${w-10}" y1="${y(10)}" y2="${y(10)}" stroke="var(--b)" stroke-dasharray="3"/><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${pts.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--a)"/>`).join('')}</svg>`}
function bars(items){return items.map(i=>`<div class="row" style="margin:3px 0"><span style="width:110px" class="m">${esc(i[0])}</span><div style="flex:1;min-width:60px"><div class="bar" style="width:${Math.max(2,i[1])}%"></div></div><b>${esc(i[2])}</b></div>`).join('')||'<div class="m">—</div>'}
function mod(h){$('mc').innerHTML=h+'<div class="row no" style="margin-top:12px"><button class="g" onclick="$(\'mod\').style.display=\'none\'">Fermer</button></div>';$('mod').style.display='flex'}
function ask(msg,fn){window._ask=fn;mod(`<p>${msg}</p><button class="d" onclick="$('mod').style.display='none';_ask()">Confirmer</button>`)}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function go(v,o={}){Object.assign(S,{v,q:'',sel:null,sid:null,eid:null},o);$('q').value='';draw()}
function draw(){const N=[['dash','Tableau de bord'],['classes','Classes'],['arch','Archives'],['data','Données']];$('nav').innerHTML='<h1>Suivi pédagogique</h1>'+N.map(n=>`<a class="${S.v==n[0]||(S.v=='class'&&n[0]=='classes')?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
$('v').innerHTML=({dash,classes,arch,data,class:klass,search})[S.v]();}
function dash(){const A=db.classes.filter(c=>!c.archived),ids=A.map(c=>c.id),ST=db.students.filter(s=>ids.includes(s.classId));let prog=0,diff=0;const ms=[],ps=[];ST.forEach(s=>{const c=cl(s.classId),a=avg(c,s).m;if(a!=null){ms.push(a);if(a<10)diff++}const sc=db.evals.filter(e=>e.classId==c.id&&e.scores[s.id]!=null).sort((a,b)=>a.date<b.date?-1:1).map(e=>e.scores[s.id]/e.max);if(sc.length>1&&sc[sc.length-1]>sc[sc.length-2])prog++;const p=pres(c,s);if(p!=null)ps.push(p)});
const today=new Date().toISOString().slice(0,10),up=db.evals.filter(e=>ids.includes(e.classId)&&e.date>=today).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
const K=(l,v)=>`<div class="card"><div class="k">${v}</div><div class="m">${l}</div></div>`;
return`<h2>Tableau de bord</h2>${db.demo?'<div class="card">Données de démonstration actives. <a href="#" onclick="clearDemo();return false">Les supprimer</a></div>':''}<div class="grid">${K('Classes',A.length)}${K('Apprenants',ST.length)}${K('Évaluations',db.evals.filter(e=>ids.includes(e.classId)).length)}${K('Séances',db.sessions.filter(s=>ids.includes(s.classId)).length)}${K('Présence moyenne',ps.length?mean(ps).toFixed(0)+' %':'—')}${K('Moyenne générale (/20)',ms.length?f(mean(ms)):'—')}${K('En progression',prog)}${K('En difficulté (&lt;10/20)',diff)}</div>
<div class="grid"><div class="card"><h3>Moyenne par classe (/20)</h3>${bars(A.map(c=>{const v=mean(stu(c.id).map(s=>avg(c,s).m).filter(x=>x!=null));return[c.name,(v||0)*5,f(v)]}))}</div><div class="card"><h3>Présence par classe</h3>${bars(A.map(c=>{const v=mean(stu(c.id).map(s=>pres(c,s)).filter(x=>x!=null));return[c.name,v||0,v!=null?v.toFixed(0)+' %':'—']}))}</div></div>
<div class="grid"><div class="card"><h3>Prochains contrôles et devoirs</h3>${up.map(e=>`<div>${esc(e.date)} · ${esc(e.title)} <span class="m">(${esc(cl(e.classId).name)})</span></div>`).join('')||'<div class="m">Aucun à venir.</div>'}</div><div class="card"><h3>Dernières activités</h3>${[...db.evals.map(e=>[e.date,'Évaluation : '+e.title]),...db.sessions.map(s=>[s.date,'Séance : '+s.theme])].sort().reverse().slice(0,5).map(a=>`<div>${esc(a[0])} · ${esc(a[1])}</div>`).join('')||'<div class="m">—</div>'}</div></div>
<div class="card"><h3>Répartition des moyennes de classes par type d’évaluation (/20)</h3>${bars(Object.keys(CATS).filter(k=>k!='participation').map(k=>{const v=mean(db.evals.filter(e=>ids.includes(e.classId)&&e.type==k).map(e=>ev(cl(e.classId),e).m).filter(x=>x!=null));return[CATS[k],(v||0)*5,f(v)]}))}</div>`}
function classes(){return`<h2>Classes</h2><div class="card"><h3>Nouvelle classe</h3><div class="row"><input id="n" placeholder="Nom (ex. 3ème A)"><input id="l" placeholder="Niveau"><input id="m" placeholder="Matière"><input id="y" placeholder="Année" value="2026-2027"><input id="d" placeholder="Description"><button onclick="addClass()">Créer</button></div></div><div class="grid">${db.classes.filter(c=>!c.archived).map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="m">${esc(c.level)} · ${esc(c.subject)} · ${esc(c.year)}<br>${stu(c.id).length} élèves</div><p><button class="sm" onclick="go('class',{cid:'${c.id}',tab:'eleves'})">Ouvrir</button></p></div>`).join('')||'<div class="m">Aucune classe.</div>'}</div>`}
function addClass(){if(!val('n'))return;db.classes.push({id:uid(),name:val('n'),level:val('l'),subject:val('m'),year:val('y'),desc:val('d'),w:W0(),scale:20,archived:0});save();draw()}
function arch(){return`<h2>Archives</h2>${db.classes.filter(c=>c.archived).map(c=>`<div class="card row"><b>${esc(c.name)}</b> <span class="m">${esc(c.year)} · ${stu(c.id).length} élèves</span><button class="sm" onclick="go('class',{cid:'${c.id}',tab:'eleves'})">Consulter</button><button class="sm g" onclick="cl('${c.id}').archived=0;save();draw()">Restaurer</button></div>`).join('')||'<div class="m">Aucune classe archivée. L’archivage conserve tout l’historique.</div>'}`}
function data(){const j=JSON.stringify(db);return`<h2>Données et sauvegarde</h2><div class="card"><p class="m">Les données sont enregistrées dans ce navigateur. Copiez la sauvegarde ci-dessous régulièrement et conservez-la ailleurs.</p><textarea id="bk" rows="5" style="width:100%">${esc(j)}</textarea><div class="row" style="margin-top:8px"><button onclick="$('bk').select();navigator.clipboard&&navigator.clipboard.writeText($('bk').value)">Copier la sauvegarde</button><button class="g" onclick="restore()">Restaurer depuis le champ</button><button class="d" onclick="ask('Effacer toutes les données ?',()=>{db={demo:0,classes:[],students:[],sessions:[],evals:[],disc:[]};save();draw()})">Tout effacer</button></div></div>`}
function restore(){try{const d=JSON.parse($('bk').value);if(!d.classes)throw 0;db=d;save();draw()}catch(e){mod('Sauvegarde invalide.')}}
function clearDemo(){ask('Supprimer toutes les données de démonstration ?',()=>{db={demo:0,classes:[],students:[],sessions:[],evals:[],disc:[]};save();draw()})}
function search(){const q=S.q.toLowerCase(),h=[];db.classes.forEach(c=>(c.name+c.subject).toLowerCase().includes(q)&&h.push(`<a href="#" onclick="go('class',{cid:'${c.id}'});return false">Classe · ${esc(c.name)}${c.archived?' (archivée)':''}</a>`));
db.students.forEach(s=>(s.nom+' '+s.prenom).toLowerCase().includes(q)&&h.push(`<a href="#" onclick="go('class',{cid:'${s.classId}',tab:'eleves',sel:'${s.id}'});S.sel='${s.id}';draw();return false">Élève · ${esc(s.nom+' '+s.prenom)} (${esc(cl(s.classId).name)})</a>`));
db.evals.forEach(e=>e.title.toLowerCase().includes(q)&&h.push(`<a href="#" onclick="go('class',{cid:'${e.classId}',tab:'${e.type=='examen'?'examen':e.type=='devoir'?'devoir':'controle'}'});return false">${CATS[e.type]} · ${esc(e.title)} (${esc(cl(e.classId).name)})</a>`));
db.sessions.forEach(e=>(e.theme+e.date).toLowerCase().includes(q)&&h.push(`<a href="#" onclick="go('class',{cid:'${e.classId}',tab:'seances'});return false">Séance · ${esc(e.date+' '+e.theme)}</a>`));return`<h2>Résultats</h2><div class="card">${h.map(x=>`<div>${x}</div>`).join('')||'<div class="m">Aucun résultat.</div>'}</div>`}
const TABS={eleves:'Élèves',seances:'Séances',devoir:'Devoirs',controle:'Contrôles',examen:'Examens',discipline:'Discipline',bulletins:'Bulletins & stats',reglages:'Réglages'};
function klass(){const c=cl(S.cid);if(!c)return'';const T={eleves,seances,devoir:()=>evalTab(c,['devoir']),controle:()=>evalTab(c,['controle','expose']),examen:()=>evalTab(c,['examen']),discipline,bulletins,reglages}[S.tab];
return`<h2>${esc(c.name)} <span class="m">${esc(c.level)} · ${esc(c.subject)} · ${esc(c.year)}${c.archived?' · archivée':''}</span></h2><div class="tabs">${Object.keys(TABS).map(k=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.sel=S.sid=S.eid=null;draw()">${TABS[k]}</button>`).join('')}</div>${T(c)}`}
function eleves(c){if(S.sel){const s=db.students.find(x=>x.id==S.sel),a=avg(c,s),E=db.evals.filter(e=>e.classId==c.id&&e.scores[s.id]!=null).sort((x,y)=>x.date<y.date?-1:1);
return`<div class="card"><button class="g sm" onclick="S.sel=null;draw()">← Liste</button><h3 style="margin-top:8px">${esc(s.prenom+' '+s.nom)} <span class="m">#${s.id}</span></h3><div class="grid"><div><div class="k">${f(a.m,c)}</div><div class="m">Moyenne ${a.prov?'provisoire':'définitive'}</div></div><div><div class="k">${pres(c,s)!=null?pres(c,s).toFixed(0)+' %':'—'}</div><div class="m">Présence</div></div></div></div>
<div class="card"><h3>Moyennes par catégorie</h3>${bars(Object.keys(CATS).map(k=>{const v=cat(c,s,k);return[CATS[k],(v||0)*5,v==null?'manquant':f(v,c)]}))}</div><div class="card"><h3>Progression</h3>${line(E.map(e=>e.scores[s.id]/e.max*20))}<table>${E.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${e.scores[s.id]}/${e.max}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Appréciation</h3><div class="row"><textarea id="pf" placeholder="Points forts" rows="2" style="flex:1">${esc(s.pf)}</textarea><textarea id="df" placeholder="Difficultés" rows="2" style="flex:1">${esc(s.df)}</textarea><textarea id="ap" placeholder="Appréciation" rows="2" style="flex:1">${esc(s.ap)}</textarea></div><button onclick="const s=db.students.find(x=>x.id=='${s.id}');s.pf=val('pf');s.df=val('df');s.ap=val('ap');save();mod('Enregistré.')">Enregistrer</button></div>
<div class="card"><h3>Discipline</h3>${db.disc.filter(d=>d.studentId==s.id).map(d=>`<div class="${d.pos?'pos':'neg'}">${esc(d.date)} · ${esc(d.cat)} · ${esc(d.desc)}</div>`).join('')||'<div class="m">Rien à signaler.</div>'}</div>`}
return`<div class="card"><h3>Ajouter des élèves (un par ligne : Nom Prénom)</h3><textarea id="bulk" rows="3" style="width:100%"></textarea><p><button onclick="addStu()">Ajouter</button> <button class="g" onclick="mkAll()">Créer tous les accès</button></p></div><div class="card w"><table><tr><th>Élève</th><th>Moyenne</th><th>Présence</th><th>Accès élève</th><th></th></tr>${stu(c.id).map(s=>{const a=avg(c,s);return`<tr><td><a href="#" onclick="S.sel='${s.id}';draw();return false">${esc(s.nom+' '+s.prenom)}</a></td><td>${f(a.m,c)}${a.prov?' <span class="tag">prov.</span>':''}</td><td>${pres(c,s)!=null?pres(c,s).toFixed(0)+' %':'—'}</td><td>${s.uid?`<button class="sm g" onclick="showAcc('${s.id}')">Identifiants</button>`:`<button class="sm" onclick="mkAcc('${s.id}')">Créer</button>`}</td><td><button class="sm d" onclick="ask('Supprimer définitivement cet élève et ses notes ?',()=>{db.students=db.students.filter(x=>x.id!='${s.id}');save();draw()})">✕</button></td></tr>`}).join('')}</table></div>`}
function addStu(){val('bulk').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const p=l.split(/\s+/);db.students.push({id:uid(),classId:S.cid,nom:p[0],prenom:p.slice(1).join(' ')})});save();draw()}
function seances(c){if(S.sid){const x=db.sessions.find(y=>y.id==S.sid);return`<div class="card"><button class="g sm" onclick="S.sid=null;draw()">← Séances</button> <b>${esc(x.date)} · ${esc(x.theme)}</b> <button class="sm" onclick="stu_('${c.id}','${x.id}')">Tous présents</button><div class="w"><table><tr><th>Apprenant</th><th>Présence</th><th>Particip. /5</th><th>Observation</th></tr>${stu(c.id).map(s=>{const a=x.att[s.id]||{p:'P',part:null,obs:''};return`<tr><td>${esc(s.nom+' '+s.prenom)}</td><td><select onchange="att('${x.id}','${s.id}','p',this.value)">${Object.keys(PR).map(k=>`<option value="${k}" ${a.p==k?'selected':''}>${PR[k]}</option>`)}</select></td><td><select onchange="att('${x.id}','${s.id}','part',this.value)"><option value="">–</option>${[0,1,2,3,4,5].map(n=>`<option ${a.part===n?'selected':''}>${n}</option>`)}</select></td><td><input value="${esc(a.obs)}" onchange="att('${x.id}','${s.id}','obs',this.value)"></td></tr>`}).join('')}</table></div></div>`}
return`<div class="card"><h3>Nouvelle séance</h3><div class="row"><input id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="st" placeholder="Thème / chapitre"><input id="so" placeholder="Objectifs"><button onclick="addSes()">Créer</button></div></div><div class="card">${ses(c.id).map(x=>`<div class="row"><b>${esc(x.date)}</b> ${esc(x.theme)} <button class="sm" onclick="S.sid='${x.id}';draw()">Ouvrir</button><button class="sm d" onclick="ask('Supprimer cette séance ?',()=>{db.sessions=db.sessions.filter(y=>y.id!='${x.id}');save();draw()})">✕</button></div>`).join('')||'<div class="m">Aucune séance.</div>'}</div>`}
function stu_(c,id){const x=db.sessions.find(y=>y.id==id);stu(c).forEach(s=>x.att[s.id]=Object.assign(x.att[s.id]||{part:null,obs:''},{p:'P'}));save();draw()}
function att(sid,st,k,v){const x=db.sessions.find(y=>y.id==sid);const a=x.att[st]=x.att[st]||{p:'P',part:null,obs:''};a[k]=k=='part'?(v===''?null:+v):v;save()}
function addSes(){db.sessions.push({id:uid(),classId:S.cid,date:val('sd'),theme:val('st')||'Séance',obj:val('so'),att:{}});save();draw()}
function evalTab(c,types){if(S.eid){const e=db.evals.find(y=>y.id==S.eid),r=ev(c,e),rk=stu(c.id).filter(s=>e.scores[s.id]!=null).sort((a,b)=>e.scores[b.id]-e.scores[a.id]);
return`<div class="card"><button class="g sm" onclick="S.eid=null;draw()">← Liste</button> <b>${esc(e.title)}</b> <span class="m">${CATS[e.type]} · ${esc(e.date)} · /${e.max} · coef ${e.coef}</span><div class="grid" style="margin-top:8px"><div><b>${f(r.m,c)}</b><div class="m">Moyenne (/${c.scale})</div></div><div><b>${f(r.hi,c)}</b><div class="m">Meilleure</div></div><div><b>${f(r.lo,c)}</b><div class="m">Plus faible</div></div><div><b>${r.ok!=null?r.ok.toFixed(0)+' %':'—'}</b><div class="m">Réussite</div></div></div></div>
<div class="card w"><table><tr><th>Élève</th><th>Note /${e.max}</th><th>Rang</th></tr>${stu(c.id).map(s=>`<tr><td>${esc(s.nom+' '+s.prenom)}</td><td><input type="number" step="0.25" min="0" max="${e.max}" value="${e.scores[s.id]??''}" placeholder="manquante" onchange="setNote('${e.id}','${s.id}',this.value)"></td><td>${rk.indexOf(s)>=0?rk.indexOf(s)+1:'—'}</td></tr>`).join('')}</table></div><div class="card"><h3>Distribution (/20)</h3>${bars([[0,4],[4,8],[8,12],[12,16],[16,20.01]].map(b=>{const n=stu(c.id).filter(s=>{const v=e.scores[s.id];if(v==null)return 0;const z=v/e.max*20;return z>=b[0]&&z<b[1]}).length;return[Math.round(b[0])+'–'+Math.min(20,Math.round(b[1])),n*100/Math.max(1,r.n),n]}))}</div>`}
return`<div class="card"><h3>Nouvelle évaluation</h3><div class="row"><select id="et">${types.map(t=>`<option value="${t}">${CATS[t]}</option>`)}</select><input id="ei" placeholder="Intitulé"><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="em" type="number" value="20" style="width:80px" title="Barème"><input id="ec" type="number" value="1" style="width:70px" title="Coefficient"><button onclick="addEv()">Créer</button></div><div class="m">Barème et coefficient. Une note vide est « manquante », jamais comptée comme zéro.</div></div><div class="card w"><table><tr><th>Date</th><th>Intitulé</th><th>Barème</th><th>Moy./20</th><th>Notes</th><th></th></tr>${evs(c.id,types).sort((a,b)=>a.date<b.date?1:-1).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${e.max}</td><td>${f(ev(c,e).m)}</td><td>${ev(c,e).n}/${stu(c.id).length}</td><td><button class="sm" onclick="S.eid='${e.id}';draw()">Fiche</button> <button class="sm d" onclick="ask('Supprimer cette évaluation et ses notes ?',()=>{db.evals=db.evals.filter(y=>y.id!='${e.id}');save();draw()})">✕</button></td></tr>`).join('')}</table></div>`}
function addEv(){if(!val('ei'))return;db.evals.push({id:uid(),classId:S.cid,type:val('et'),title:val('ei'),date:val('ed'),max:+val('em')||20,coef:+val('ec')||1,scores:{},obs:''});save();draw()}
function setNote(e,s,v){const x=db.evals.find(y=>y.id==e);if(v===''||isNaN(+v))delete x.scores[s];else x.scores[s]=Math.min(+v,x.max);save()}
function discipline(c){const ids=stu(c.id).map(s=>s.id),CAT=['Indiscipline','Perturbation du cours','Manque de respect','Absence injustifiée','Retard répété','Non-respect des consignes','Comportement positif','Initiative et leadership'];
return`<div class="card"><h3>Nouvel événement</h3><div class="row"><select id="ds">${stu(c.id).map(s=>`<option value="${s.id}">${esc(s.nom+' '+s.prenom)}</option>`)}</select><select id="dc">${CAT.map(x=>`<option>${x}</option>`)}</select><select id="dg"><option>Légère</option><option>Moyenne</option><option>Grave</option></select><input id="dd" placeholder="Description"><input id="dm" placeholder="Mesure / sanction"><button onclick="addDisc()">Enregistrer</button></div></div><div class="card">${db.disc.filter(d=>ids.includes(d.studentId)).sort((a,b)=>a.date<b.date?1:-1).map(d=>{const s=db.students.find(x=>x.id==d.studentId);return`<div class="${d.pos?'pos':'neg'}">${esc(d.date)} · ${esc(s.nom)} · ${esc(d.cat)} (${esc(d.sev)}) — ${esc(d.desc)} ${d.mesure?'→ '+esc(d.mesure):''}</div>`}).join('')||'<div class="m">Aucun événement.</div>'}</div>`}
function addDisc(){const cat=val('dc');db.disc.push({id:uid(),studentId:val('ds'),date:new Date().toISOString().slice(0,10),cat,sev:val('dg'),desc:val('dd'),mesure:val('dm'),pos:/positif|Initiative/.test(cat)?1:0});save();draw()}
function bulletins(c){const L=stu(c.id).map(s=>({s,a:avg(c,s)})).sort((x,y)=>(y.a.m??-1)-(x.a.m??-1)),E=evs(c.id).sort((a,b)=>a.date<b.date?-1:1);
return`<div class="card"><h3>Évolution de la moyenne de classe</h3>${line(E.map(e=>ev(c,e).m).filter(x=>x!=null))}</div><div class="card w"><div class="row"><h3 style="margin:0">Classement</h3><button class="sm" onclick="csv('${c.id}')">Exporter CSV</button></div><table><tr><th>#</th><th>Élève</th><th>Moyenne</th><th>Statut</th><th></th></tr>${L.map((r,i)=>`<tr><td>${r.a.m!=null?i+1:'—'}</td><td>${esc(r.s.nom+' '+r.s.prenom)}</td><td>${f(r.a.m,c)}</td><td><span class="tag">${r.a.prov?'provisoire':'définitive'}</span></td><td><button class="sm" onclick="bull('${r.s.id}')">Bulletin</button></td></tr>`).join('')}</table></div>`}
function bull(id){const s=db.students.find(x=>x.id==id),c=cl(s.classId),a=avg(c,s);mod(`<h2>Bulletin — ${esc(s.prenom+' '+s.nom)}</h2><p>${esc(c.name)} · ${esc(c.subject)} · ${esc(c.year)}</p><table>${Object.keys(CATS).map(k=>`<tr><td>${CATS[k]} (${c.w[k]} %)</td><td>${cat(c,s,k)==null?'manquant':f(cat(c,s,k),c)+'/'+c.scale}</td></tr>`).join('')}</table><p><b>Moyenne générale : ${f(a.m,c)}/${c.scale}</b> (${a.prov?'provisoire':'définitive'}) · Présence : ${pres(c,s)!=null?pres(c,s).toFixed(0)+' %':'—'}</p><p><b>Appréciation :</b> ${esc(s.ap)||'—'}<br><b>Points forts :</b> ${esc(s.pf)||'—'}<br><b>Difficultés :</b> ${esc(s.df)||'—'}</p><button class="no" onclick="window.print()">Imprimer / PDF</button>`)}
function csv(id){const c=cl(id),E=evs(id),r=[['Élève',...E.map(e=>e.title+' /'+e.max),'Moyenne /'+c.scale,'Statut'].join(';')];stu(id).forEach(s=>r.push([s.nom+' '+s.prenom,...E.map(e=>e.scores[s.id]??''),f(avg(c,s).m,c),avg(c,s).prov?'provisoire':'définitif'].join(';')));mod(`<p class="m">Copiez ce tableau (compatible Excel).</p><textarea id="cv" rows="10" style="width:100%">${esc(r.join('\n'))}</textarea><p><button onclick="$('cv').select();navigator.clipboard&&navigator.clipboard.writeText($('cv').value)">Copier</button></p>`)}
function reglages(c){return`<div class="card"><h3>Pondérations (%)</h3><div class="row">${Object.keys(CATS).map(k=>`<label>${CATS[k]} <input type="number" style="width:70px" value="${c.w[k]}" onchange="cl('${c.id}').w['${k}']=+this.value;save()"></label>`).join('')}</div><div class="row"><label>Échelle d’affichage <select onchange="cl('${c.id}').scale=+this.value;save();draw()">${[10,20,50,100].map(n=>`<option ${c.scale==n?'selected':''}>${n}</option>`)}</select></label></div></div><div class="card row"><button class="g" onclick="cl('${c.id}').archived=${c.archived?0:1};save();go('${c.archived?'class':'classes'}',{cid:'${c.id}'})">${c.archived?'Restaurer':'Archiver'}</button><button class="d" onclick="ask('Supprimer définitivement cette classe et tout son historique ?',()=>{const i=db.students.filter(s=>s.classId=='${c.id}').map(s=>s.id);db.classes=db.classes.filter(x=>x.id!='${c.id}');db.students=db.students.filter(s=>s.classId!='${c.id}');db.sessions=db.sessions.filter(s=>s.classId!='${c.id}');db.evals=db.evals.filter(s=>s.classId!='${c.id}');db.disc=db.disc.filter(d=>!i.includes(d.studentId));save();go('classes')})">Supprimer</button></div>`}
const slug=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
async function mkAcc(id,q){const s=db.students.find(x=>x.id==id);if(s.uid)return;const n=slug(s.prenom.split(' ')[0])+'.'+slug(s.nom);let l=n,i=1;const p=Math.random().toString(36).slice(2,8);
for(let t=0;t<8;t++){while(db.students.some(x=>x.login==l))l=n+(++i);
try{s.uid=await FB.mk(l,p);s.login=l;s.pwd=p;save();break}catch(e){if(e.code=='auth/email-already-in-use'&&t<7){l=n+(++i);continue}if(!q)mod('Erreur : '+esc(e.code||e.message));return}}
if(!q){draw();showAcc(id)}}
async function mkAll(){for(const s of stu(S.cid))await mkAcc(s.id,1);draw();mod('Accès créés. Ouvrez « Identifiants » sur chaque ligne pour les communiquer aux élèves.')}
function showAcc(id){const s=db.students.find(x=>x.id==id);mod(`<h3>${esc(s.prenom+' '+s.nom)}</h3><p>Identifiant : <b>${esc(s.login)}</b><br>Mot de passe : <b>${esc(s.pwd)}</b></p><p class="m">À communiquer à l’élève.</p>`)}
window.getDB=()=>db;
window.snap=s=>{const c=cl(s.classId),a=avg(c,s),sc=c.scale||20,g=v=>v==null?null:+(v/20*sc).toFixed(2);return{nom:s.nom,prenom:s.prenom,classe:c.name,matiere:c.subject,annee:c.year,scale:sc,moy:g(a.m),prov:a.prov,pres:pres(c,s),cats:Object.keys(CATS).map(k=>({l:CATS[k],v:g(cat(c,s,k))})),evals:db.evals.filter(e=>e.classId==c.id&&e.scores[s.id]!=null).sort((x,y)=>x.date<y.date?-1:1).map(e=>({d:e.date,t:e.title,k:CATS[e.type],n:e.scores[s.id],m:e.max})),ap:s.ap||'',pf:s.pf||'',df:s.df||''}};
window.startApp=d=>{db=d||{demo:0,classes:[],students:[],sessions:[],evals:[],disc:[]};draw()};
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAqm9VAo7PGMmy04q3SqyNSRiYa9RVuHCE",authDomain:"culture-litteraire.firebaseapp.com",projectId:"culture-litteraire",storageBucket:"culture-litteraire.firebasestorage.app",messagingSenderId:"811347559888",appId:"1:811347559888:web:25f57f511adea3062c65d5"};
const D='@eleves.culture-litteraire.app',app=initializeApp(cfg),auth=getAuth(app),fs=getFirestore(app);
let sec,un,last={};try{last=JSON.parse(localStorage.getItem('pushed')||'{}')}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.FB={
 out:()=>signOut(auth),
 async login(){let i=$('li').value.trim().toLowerCase();if(!i.includes('@'))i+=D;try{await signInWithEmailAndPassword(auth,i,$('lp').value)}catch(e){$('le').textContent='Identifiant ou mot de passe incorrect.'}},
 async mk(l,p){sec=sec||initializeApp(cfg,'sec');const a=getAuth(sec),c=await createUserWithEmailAndPassword(a,l+D,p);await signOut(a);return c.user.uid},
 async push(){if(!window._isT)return;const s=$('sync');try{s.textContent='Synchronisation…';await setDoc(doc(fs,'teachers','main'),{json:JSON.stringify(getDB()),t:Date.now()});
  for(const st of getDB().students){if(!st.uid)continue;const r=snap(st),j=JSON.stringify(r);if(last[st.uid]===j)continue;await setDoc(doc(fs,'results',st.uid),{...r,teacherUid:auth.currentUser.uid,maj:Date.now()});last[st.uid]=j}
  localStorage.setItem('pushed',JSON.stringify(last));s.textContent='Synchronisé ✓'}catch(e){s.textContent='Erreur de synchro : '+(e.code||e.message)}}
};
function gate(){$('gate').innerHTML=`<div class="card" style="max-width:360px;margin:12vh auto"><h2>Suivi pédagogique</h2><p class="m">Élève : identifiant donné par votre professeur. Professeur : votre e-mail.</p><input id="li" placeholder="Identifiant ou e-mail" style="width:100%;margin-bottom:8px" autocapitalize="none"><input id="lp" type="password" placeholder="Mot de passe" style="width:100%;margin-bottom:8px"><button onclick="FB.login()">Se connecter</button><p id="le" class="neg"></p></div>`}
const f=n=>n==null?'—':String(n).replace('.',',');
function student(u){$('gate').innerHTML='<div id="sv" style="max-width:640px;margin:0 auto;padding:14px">Chargement…</div>';
 un=onSnapshot(doc(fs,'results',u.uid),s=>{const sv=$('sv');if(!sv)return;const r=s.data();if(!r){sv.textContent='Aucun résultat pour le moment.';return}
 sv.innerHTML=`<div class="row"><h2 style="flex:1;margin:0">${esc(r.prenom+' '+r.nom)}</h2><button class="g sm" onclick="FB.out()">Quitter</button></div><p class="m">${esc(r.classe)} · ${esc(r.matiere)} · ${esc(r.annee)}</p><div class="grid"><div class="card"><div class="k">${f(r.moy)}/${r.scale}</div><div class="m">Moyenne ${r.prov?'provisoire':'définitive'}</div></div><div class="card"><div class="k">${r.pres==null?'—':Math.round(r.pres)+' %'}</div><div class="m">Présence</div></div></div><div class="card"><h3>Par catégorie</h3>${r.cats.map(c=>`<div class="row"><span style="flex:1">${esc(c.l)}</span><b>${c.v==null?'—':f(c.v)+'/'+r.scale}</b></div>`).join('')}</div><div class="card w"><h3>Mes notes</h3><table>${r.evals.map(e=>`<tr><td>${esc(e.d)}</td><td>${esc(e.t)}</td><td>${f(e.n)}/${e.m}</td></tr>`).join('')||'<tr><td class="m">Aucune note.</td></tr>'}</table></div>${r.ap?`<div class="card"><h3>Appréciation</h3>${esc(r.ap)}</div>`:''}<p class="m">Mis à jour : ${new Date(r.maj).toLocaleString('fr-FR')}</p>`},()=>{})}
onAuthStateChanged(auth,async u=>{un&&un();un=null;$('app').style.display='none';$('gate').innerHTML='';
 if(!u){window._isT=false;gate();return}
 if(u.email.endsWith(D)){window._isT=false;student(u);return}
 window._isT=true;let d=null;try{const s=await getDoc(doc(fs,'teachers','main'));if(s.exists())d=JSON.parse(s.data().json)}catch(e){try{d=JSON.parse(localStorage.getItem(K))}catch(x){}}
 $('app').style.display='';startApp(d)});
